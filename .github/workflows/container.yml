name: Test and build container

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image to this repository's GHCR package
        type: boolean
        default: false
      version:
        description: Optional version tag (for example v1.0.0)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate both NAS architectures (no publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load native image for startup smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: immich-smart-albums:test
          cache-from: type=gha
      - name: Verify entrypoint and non-root read-only execution
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m immich-smart-albums:test --help
          test "$(docker image inspect --format '{{.Config.User}}' immich-smart-albums:test)" = '1000:1000'
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --mount type=bind,source="$PWD/config/config.example.yaml",target=/config/config.yaml,readonly \
            immich-smart-albums:test check

  publish:
    # Publishing is manual and limited to the default branch of the chosen fork.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare safe GHCR tags
        id: tags
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo 'Version must be a version tag such as v1.0.0 or v1.0.0-rc.1.' >&2
            exit 1
          fi
          {
            echo 'tags<<EOF'
            echo "$image:sha-$COMMIT_SHA"
            echo "$image:latest"
            if [[ -n "$VERSION" ]]; then echo "$image:$VERSION"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Pull and smoke-test the published amd64 image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          pinned="$image:sha-$COMMIT_SHA"
          deploy="$image:${VERSION:-sha-$COMMIT_SHA}"
          docker buildx imagetools inspect "$pinned"
          docker pull --platform linux/amd64 "$pinned"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges "$pinned" --version
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges "$pinned" --help
          test "$(docker image inspect --format '{{.Config.User}}' "$pinned")" = '1000:1000'
          # An archive lets the owner deploy without creating a registry token.
          docker tag "$pinned" "$deploy"
          docker save "$deploy" | gzip -1 > immich-smart-albums-linux-amd64.tar.gz
      - name: Attach verified NAS image
        uses: actions/upload-artifact@v4
        with:
          name: immich-smart-albums-linux-amd64
          path: immich-smart-albums-linux-amd64.tar.gz
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
